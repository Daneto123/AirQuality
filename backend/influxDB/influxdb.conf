[meta]
  dir = "/var/lib/influxdb/meta"

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"

[http]
  bind-address = "${INFLUXDB_BIND_ADDRESS}"

[clustering]
  enabled = false

[continuous_queries]
  dir = "/var/lib/influxdb/cq"

[shard-precreation]
  enabled = false

[retention]
  database = "${DOCKER_INFLUXDB_INIT_BUCKET}"
  duration = "${DOCKER_INFLUXDB_INIT_RETENTION}"
  replication = 1

[auth]
  enabled = true
  anonymous-access = false
  token-auth-enabled = true

[users]
  admin = adminpassword

[organizations]
  my_org = VratsaSoft

[init]
  mode = setup