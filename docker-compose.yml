  influxdb:
    image: influxdb:2.0
    restart: always
    ports:
      # - "YOUR_SERVER_IP:8086:8086"
      - "192.168.1.137:8087:8086"
      #- "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_BUCKET=sensorBucket
      - DOCKER_INFLUXDB_INIT_RETENTION=1w
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./backend/influxDB/influxdb.conf:/etc/influxdb/influxdb.conf

volumes:
  influxdb_data: {}

networks:
  my-network:
    driver: bridge